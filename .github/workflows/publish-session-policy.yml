name: Publish verified session policy update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-session-policy.yml']
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply reviewed source patch
        env:
          SOURCE_PATCH: 
        run: |
          test "$(git rev-parse HEAD^)" = "83a376d4a2e5da728139ef12ed9216f25ee477f7"
          python - <<'PY'
          import os,base64,gzip,hashlib,pathlib
          data=gzip.decompress(base64.b64decode(os.environ['SOURCE_PATCH']))
          assert hashlib.sha256(data).hexdigest() == '80fc7d326e71863ab5559cb4fe30920ec1444eb3bb5c2fa082515fc77357b4cb'
          pathlib.Path('/tmp/itis-email.patch').write_bytes(data)
          PY
          git apply --check /tmp/itis-email.patch
          git apply /tmp/itis-email.patch
          git rm .github/workflows/publish-session-policy.yml
          git add app components db deployment drizzle-pg lib scripts package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add admin-controlled single and multiple login sessions'
          git push origin HEAD:main
      - name: Start standard verification before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

